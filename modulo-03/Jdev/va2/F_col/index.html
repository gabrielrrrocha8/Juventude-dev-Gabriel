<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Formatação de Colunas</title>
</head>
<body>
    <div class="container"><!--grid (12 colunas)
        <div class="row align-items-xxl-center">Verticalmente centralizados quando a tela >= 1400px
        <div class="row justify-content-center">Centralizados horizontalmente
        <div class="row justify-content-between">Espaço entre as colunas (dos lados)
        <div class="row justify-content-around">Espaço ao redor das colunas (todas as direções)
        <div class="row justify-content-evenly">Espaço igual entre as colunas (lados), no inicio e no fim-->
        <div class="row"><!--(row) linha
            <div class="col-3 offset-1">Coluna 1</div>offset-1 desloca uma coluna para a esquerda -->
            <div class="col-3 mx-auto">Coluna 1</div><!-- mx-auto centraliza horizontalmente
            <div class="col-3">Coluna 1</div>
            <div class="col-3 ms-auto">Coluna 2</div>margin start (margem à esquerda) "auto" = todo o espaço disponível

            <div class="col-3">Coluna 2</div>
            <div class="col-3">Coluna 3</div>-->
        </div>
    
</body>
</html>
