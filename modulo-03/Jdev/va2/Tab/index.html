<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu portfólio</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Tabelas</title>
</head>
<body>
    <div class="container">
        <table class="table table-primary table-striped-columns table-hover table-bordered table-sm table-active
        align-middle text-center caption-top">
            <!--"striped" = linhas com cores alternadas-->
            <!--"striped-columns" = Colunas com cores alternadas-->
            <!--"table-hover" = Passando o mouse nas linhas, elas ficam levemente iluminadas-->
            <!--"table-active" = Linhas ativas-->
            <!--"table-bordered" = Bordas nas colunas da tabela-->
            <!--"table-sm" = Tabela pequena (compacta)-->
            <!--"align-middle" = Alinhamento vertical (no meio) do conteúdo das células-->
            <!--"text-center" = Alinhamento horizontal (centro) do conteúdo das células-->
            <!--"caption-top" = Título da tabela posicionado no topo-->
            <!--"(tr>td{célula $}*20)*5" = tabela com 20 colunas e 5 linhas-->
            <thead class="table-dark">                          
                <tr>
                    <th>coluna 1</th>
                    <th>coluna 2</th>
                    <th>Coluna 3</th>
                    <th>Coluna 4</th>
                </tr>
            </thead>
            <tbody class="table-group-divider"><!--"table-group-divider" = Divisores entre grupos de linhas-->
                <tr>
                    <td>coluna 1</td>
                    <td>coluna 2</td>
                    <td>Coluna 3</td>
                    <td>Coluna 4</td>
                </tr>
                <tr class="table-active"><!--"table-active" = Linha ativa (destacada)-->
                    <td>coluna 1</td>
                    <td>Coluna 2</td>
                    <td>Coluna 3</td>
                    <td>Coluna 4</td>
                </tr>
                <tr>
                    <td>Coluna 1</td>
                    <td>Coluna 2</td>
                    <td>Coluna 3</td>
                    <td>Coluna 4</td>
                </tr>
            </tbody>
            <caption class="text-center">Título da tabela</caption><!--"text" = Título no meio da tabela-->
        </table>
    </div>
</body>
</html>
