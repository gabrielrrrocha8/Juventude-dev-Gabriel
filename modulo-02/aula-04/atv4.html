<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form class="/enviar-contato" method="post">
        <input type="checkbox" name="aceite" value="sim"> Aceito os termos
        <input type="radio" name="genero" value="f"> Feminino
        <input type="radio" name="genero" value="m"> Masculino
        <input type="radio" name="genero" value="outro"> outro
        <input type="file" name="foto_perfil">
        <textarea type="number" name="numero" value=""> Número para contato
    <br>
    <br>
    <br> 
    <select name="assunto">
        <option value="duvida">Dúvida</option>
        <option value="elogio">Elogio</option>
        <option value="reclamacao">Reclamação</option>
    </select>

    <textarea name="mensagem" rows="10" 
    placeholder="Escreva sua mensagem"></textarea>
    <button type="submit">Enviar</button>
</form>
<br>
<label for="campo-nome">Nome Completo</label>
<input type="text" id="campo-nome" name="nome" required minlength="3">
<label for="email">E-mail</label>
<input type="email" id="email" name="email" required>
<br>
<br>
<br>
<label for="cep">Telefone</label>
<input type="text" id="cep" name="cep" pattern="\([0-9]{2}\)[0-9]{5}-[0-9]{4}" title="Formato esperado: (00) 00000-0000">
</body>
</html>
