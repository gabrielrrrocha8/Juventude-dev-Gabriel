<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Layout com Flexbox</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- PRIMEIRO BLOCO -->
  <section class="secao-topo">

    <div class="caixa-grande">
      Caixa grande
    </div>

    <div class="caixa-pequena">
      Caixa pequena
    </div>

  </section>


  <!-- SEGUNDO BLOCO -->
  <section class="secao-meio">

    <!-- Parte de cima -->
    <div class="linha-superior">

      <div class="caixa-esquerda">
        Caixa
      </div>

      <div class="circulo"></div>

    </div>

    <!-- Caixa grande de baixo -->
    <div class="caixa-inferior">
      Caixa inferior
    </div>

  </section>


  <!-- TERCEIRO BLOCO -->
  <section class="secao-final">

  </section>

</body>

</html>
